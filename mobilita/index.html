<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'unsafe-inline' 'self' blob:; worker-src 'self' blob:; style-src 'unsafe-inline' 'self'; connect-src 'self' https://tiles.openfreemap.org https://*.openfreemap.org; img-src 'self' data: blob:; font-src 'self' https://tiles.openfreemap.org; base-uri 'none'; form-action 'none'"
  >
  <title>Bari AMTAB · Bus in tempo reale</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/vendor/maplibre-gl.css">
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2427;
      --muted: #5d686d;
      --border: #dadedf;
      --paper: #f5f6f6;
      --card-bg: rgba(255, 255, 255, 0.94);
      --accent: #1d2427;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --ink: #e7ecee;
      --muted: #a7b2b6;
      --border: #3c484d;
      --paper: #151c20;
      --card-bg: rgba(32, 41, 45, 0.94);
      --accent: #e7ecee;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 52px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .brand-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.06);
      color: var(--muted);
    }
    :root[data-theme="dark"] .brand-tag { background: rgba(255, 255, 255, 0.1); }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #1b8a43;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(27, 138, 67, 0.1);
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #1b8a43;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    button, input {
      font: inherit;
      color: inherit;
    }
    .btn {
      border: 1px solid var(--border);
      background: var(--card-bg);
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover {
      background: rgba(0, 0, 0, 0.05);
    }
    :root[data-theme="dark"] .btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .btn[aria-pressed="true"] {
      background: var(--accent);
      color: var(--paper);
      border-color: var(--accent);
    }
    #map-shell {
      position: relative;
      flex: 1;
      width: 100%;
      height: calc(100vh - 52px);
    }
    #map {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
    }
    #overlay-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }
    .search-box {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 320px;
      max-width: calc(100vw - 32px);
      z-index: 10;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .search-input-wrap {
      display: flex;
      align-items: center;
      padding: 8px 12px;
    }
    .search-input-wrap input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      font-size: 14px;
    }
    .search-results {
      max-height: 280px;
      overflow-y: auto;
      border-top: 1px solid var(--border);
      display: none;
    }
    .search-item {
      padding: 8px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
    }
    .search-item:hover {
      background: rgba(0, 0, 0, 0.05);
    }
    :root[data-theme="dark"] .search-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .map-controls {
      position: absolute;
      right: 16px;
      bottom: 24px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      padding: 6px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .map-controls button {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .map-controls button:hover {
      background: rgba(0, 0, 0, 0.08);
    }
    :root[data-theme="dark"] .map-controls button:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    .detail-card {
      position: absolute;
      left: 16px;
      bottom: 24px;
      width: 380px;
      max-width: calc(100vw - 32px);
      max-height: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      z-index: 20;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .card-header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .card-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .route-pill {
      font-weight: 800;
      font-size: 14px;
      padding: 4px 10px;
      border-radius: 8px;
      color: #fff;
    }
    .card-close {
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 18px;
      color: var(--muted);
      padding: 4px 8px;
      border-radius: 6px;
    }
    .card-close:hover {
      background: rgba(0, 0, 0, 0.08);
      color: var(--ink);
    }
    .card-body {
      padding: 14px 16px;
      overflow-y: auto;
      flex: 1;
    }
    .delay-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
    }
    .delay-on-time { background: #dcfce7; color: #166534; }
    .delay-late { background: #fee2e2; color: #991b1b; }
    .delay-early { background: #e0f2fe; color: #075985; }
    .delay-unknown { background: #f3f4f6; color: #4b5563; }
    .timeline {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .timeline-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
    }
    .timeline-stop-name {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .timeline-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 2px solid var(--muted);
      flex-shrink: 0;
    }
    .timeline-dot.passed { background: var(--muted); }
    .timeline-dot.next { border-color: #bd5636; background: #bd5636; }
    .maplibregl-ctrl-bottom-right, .maplibregl-ctrl-bottom-left {
      z-index: 5 !important;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>BARI BUS MAP</span>
      <span class="brand-tag">AMTAB</span>
      <div class="live-badge">
        <span class="live-dot"></span>
        <span id="live-count">Live</span>
      </div>
    </div>
    <div class="header-actions">
      <button id="toggle-stops" class="btn" type="button" aria-pressed="false">Fermate</button>
      <button id="theme-toggle" class="btn" type="button">Tema scuro</button>
    </div>
  </header>

  <div id="map-shell">
    <div id="map"></div>
    <canvas id="overlay-canvas"></canvas>

    <div class="search-box">
      <div class="search-input-wrap">
        <input id="search-input" type="text" placeholder="Cerca linea o fermata…" autocomplete="off">
      </div>
      <div id="search-results" class="search-results"></div>
    </div>

    <div class="map-controls">
      <button id="ctrl-zoom-in" title="Aumenta zoom">+</button>
      <button id="ctrl-zoom-out" title="Riduci zoom">−</button>
      <button id="ctrl-center" title="Centro città">⊙</button>
      <button id="ctrl-north" title="Orienta a nord">N</button>
    </div>

    <div id="bus-card" class="detail-card" style="display: none;">
      <div class="card-header">
        <div class="card-title-group">
          <span id="bus-card-badge" class="route-pill">12</span>
          <div>
            <div id="bus-card-dest" style="font-weight: 700; font-size: 15px;">Direzione</div>
            <div id="bus-card-vid" style="font-size: 12px; color: var(--muted);">Bus #1234</div>
          </div>
        </div>
        <button class="card-close" id="bus-card-close" title="Chiudi (Esc)">×</button>
      </div>
      <div class="card-body">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
          <span id="bus-card-delay" class="delay-pill delay-on-time">In orario</span>
          <span id="bus-card-speed" style="font-size: 12px; color: var(--muted);">24 km/h</span>
        </div>
        <div style="font-weight: 600; font-size: 12px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px;">Prossime fermate</div>
        <div id="bus-card-timeline" class="timeline"></div>
      </div>
    </div>

    <div id="stop-card" class="detail-card" style="display: none;">
      <div class="card-header">
        <div>
          <div id="stop-card-name" style="font-weight: 700; font-size: 15px;">Nome Fermata</div>
          <div id="stop-card-id" style="font-size: 12px; color: var(--muted);">Fermata #1001</div>
        </div>
        <button class="card-close" id="stop-card-close" title="Chiudi (Esc)">×</button>
      </div>
      <div class="card-body">
        <div style="font-weight: 600; font-size: 12px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px;">Prossimi arrivi</div>
        <div id="stop-card-arrivals" class="timeline"></div>
      </div>
    </div>
  </div>

  <script src="/assets/vendor/maplibre-gl.js"></script>
  <script>
    const BARI_CENTER = [16.871871, 41.117143];
    let isDark = localStorage.getItem("bari-bus-map-theme") === "dark";
    if (isDark) {
      document.documentElement.dataset.theme = "dark";
    }

    const STYLES = {
      light: "https://tiles.openfreemap.org/styles/positron",
      dark: "https://tiles.openfreemap.org/styles/dark"
    };

    const map = new maplibregl.Map({
      container: "map",
      style: isDark ? STYLES.dark : STYLES.light,
      center: BARI_CENTER,
      zoom: 12.8,
      minZoom: 10,
      maxZoom: 19,
      attributionControl: false
    });

    map.addControl(new maplibregl.AttributionControl({
      compact: true,
      customAttribution: '<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> · © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
    }), "bottom-left");

    // Route Colors
    const ROUTE_COLORS = {
      "01": "#e11d48", "02": "#2563eb", "03": "#16a34a", "04": "#d97706", "06": "#9333ea",
      "11": "#0891b2", "11/": "#0891b2", "12": "#ea580c", "12/": "#ea580c", "13": "#4f46e5",
      "14": "#059669", "16": "#db2777", "20": "#65a30d", "21": "#475569", "22": "#ca8a04",
      "27": "#7c3aed", "53": "#0284c7"
    };
    function getRouteColor(rid) {
      return ROUTE_COLORS[String(rid)] || "#475569";
    }

    // Overlay Canvas for Live Vehicles
    const overlay = document.getElementById("overlay-canvas");
    const ctx = overlay.getContext("2d");

    let vehicles = new Map(); // id -> vehicle object
    let selectedVehicleId = null;
    let stopsVisible = false;
    let routesData = {};
    let stopsData = [];
    let stopsMap = new Map(); // id -> stop name
    let shapeStopsData = {}; // shapeId -> [stopId, ...]
    const shapeCache = new Map();
    let animFrame = 0;

    function resizeOverlay() {
      const rect = map.getContainer().getBoundingClientRect();
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      overlay.width = Math.round(rect.width * ratio);
      overlay.height = Math.round(rect.height * ratio);
      overlay.style.width = rect.width + "px";
      overlay.style.height = rect.height + "px";
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    // Vehicle Smooth Movement (1.6s cubic ease-out)
    function currentVehiclePosition(v, now) {
      const elapsed = now - v._startedAt;
      const alpha = Math.min(1, elapsed / 1600);
      if (alpha >= 1) return { lon: v.lon, lat: v.lat };
      const t = 1 - Math.pow(1 - alpha, 3);
      return {
        lon: v._fromLon + (v.lon - v._fromLon) * t,
        lat: v._fromLat + (v.lat - v._fromLat) * t
      };
    }

    let hits = []; // [{ id, x, y, r }]

    function drawOverlay() {
      const rect = map.getContainer().getBoundingClientRect();
      const width = rect.width, height = rect.height;
      ctx.clearRect(0, 0, width, height);
      hits = [];

      const now = performance.now();
      let hasMoving = false;

      for (const v of vehicles.values()) {
        const pos = currentVehiclePosition(v, now);
        if (now - v._startedAt < 1600) hasMoving = true;

        const p = map.project([pos.lon, pos.lat]);
        if (p.x < -30 || p.y < -30 || p.x > width + 30 || p.y > height + 30) continue;

        const isSelected = String(v.vid ?? v.id) === selectedVehicleId;
        const color = getRouteColor(v.rid);
        const label = String(v.route_short_name || v.rid || "");

        // Shadow
        ctx.beginPath();
        ctx.ellipse(p.x, p.y + 2, 7, 3, 0, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(0, 0, 0, 0.18)";
        ctx.fill();

        // Selected ring
        if (isSelected) {
          ctx.beginPath();
          ctx.arc(p.x, p.y - 7, 18, 0, Math.PI * 2);
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 4;
          ctx.stroke();
          ctx.strokeStyle = "#1d2427";
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }

        // Pill dimensions
        ctx.font = "700 10px system-ui, -apple-system, sans-serif";
        const textW = Math.max(16, ctx.measureText(label).width);
        const pillW = textW + 12;
        const pillH = 18;
        const pillX = p.x - pillW / 2;
        const pillY = p.y - 7 - pillH / 2;

        // White border
        ctx.beginPath();
        ctx.roundRect(pillX - 1.5, pillY - 1.5, pillW + 3, pillH + 3, 6);
        ctx.fillStyle = "#ffffff";
        ctx.fill();

        // Color fill
        ctx.beginPath();
        ctx.roundRect(pillX, pillY, pillW, pillH, 5);
        ctx.fillStyle = color;
        ctx.fill();

        // Route text
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#ffffff";
        ctx.fillText(label, p.x, p.y - 7);

        // Delay badge dot
        const delay = v.delay != null ? Number(v.delay) : null;
        let delayColor = "#94a3b8"; // slate / unknown
        if (delay != null) {
          if (delay <= 120 && delay >= -60) delayColor = "#22c55e"; // green on-time
          else if (delay > 120) delayColor = "#ef4444"; // red late
          else if (delay < -60) delayColor = "#3b82f6"; // blue early
        }

        ctx.beginPath();
        ctx.arc(pillX + pillW - 2, pillY + 2, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = delayColor;
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.2;
        ctx.stroke();

        hits.push({ id: String(v.vid ?? v.id), x: p.x, y: p.y - 7, r: Math.max(14, pillW / 2 + 4) });
      }

      if (hasMoving) {
        cancelAnimationFrame(animFrame);
        animFrame = requestAnimationFrame(drawOverlay);
      }
    }

    map.on("render", drawOverlay);
    map.on("resize", () => { resizeOverlay(); drawOverlay(); });
    map.on("load", () => {
      resizeOverlay();
      initMapSources();
      startPolling();
    });

    // Map Sources for Route and Stops
    function initMapSources() {
      // Route line source
      map.addSource("route-line", {
        type: "geojson",
        data: { type: "FeatureCollection", features: [] }
      });

      // Route casing
      map.addLayer({
        id: "route-casing",
        type: "line",
        source: "route-line",
        layout: { "line-join": "round", "line-cap": "round" },
        paint: {
          "line-color": "#ffffff",
          "line-width": 8,
          "line-opacity": 0.95
        }
      });

      // Route inner line
      map.addLayer({
        id: "route-inner",
        type: "line",
        source: "route-line",
        layout: { "line-join": "round", "line-cap": "round" },
        paint: {
          "line-color": ["get", "color"],
          "line-width": 5,
          "line-opacity": 0.9
        }
      });

      // Stops source
      map.addSource("stops", {
        type: "geojson",
        data: { type: "FeatureCollection", features: [] }
      });

      // Stops circle layer
      map.addLayer({
        id: "stops-circle",
        type: "circle",
        source: "stops",
        minzoom: 11,
        layout: { "visibility": "none" },
        paint: {
          "circle-radius": ["interpolate", ["linear"], ["zoom"], 11, 2.5, 14, 4.5, 17, 7],
          "circle-color": "#ffffff",
          "circle-stroke-color": "#0f172a",
          "circle-stroke-width": 2
        }
      });

      // Stops text label layer
      map.addLayer({
        id: "stops-label",
        type: "symbol",
        source: "stops",
        minzoom: 14.5,
        layout: {
          "visibility": "none",
          "text-field": ["get", "name"],
          "text-size": 11,
          "text-offset": [0, 1.2],
          "text-anchor": "top",
          "text-max-width": 9
        },
        paint: {
          "text-color": "#0f172a",
          "text-halo-color": "#ffffff",
          "text-halo-width": 2
        }
      });

      // Click on stop
      map.on("click", "stops-circle", (e) => {
        if (!e.features?.length) return;
        const prop = e.features[0].properties;
        showStopCard(prop.id, prop.name);
      });
      map.on("mouseenter", "stops-circle", () => { map.getCanvas().style.cursor = "pointer"; });
      map.on("mouseleave", "stops-circle", () => { map.getCanvas().style.cursor = ""; });
    }

    // Decode Google Encoded Polyline
    function decodePolyline(encoded) {
      const points = [];
      let lat = 0, lon = 0, index = 0;
      while (index < encoded.length) {
        let result = 0, shift = 0, byte;
        do { byte = encoded.charCodeAt(index++) - 63; result |= (byte & 31) << shift; shift += 5; } while (byte >= 32 && index < encoded.length);
        lat += result & 1 ? ~(result >> 1) : result >> 1;
        result = 0; shift = 0;
        do { byte = encoded.charCodeAt(index++) - 63; result |= (byte & 31) << shift; shift += 5; } while (byte >= 32 && index < encoded.length);
        lon += result & 1 ? ~(result >> 1) : result >> 1;
        points.push([lon / 100000, lat / 100000]);
      }
      return points;
    }

    async function loadShape(shapeId) {
      if (!shapeId) return null;
      if (shapeCache.has(shapeId)) return shapeCache.get(shapeId);
      try {
        const r = await fetch("/api/shapes?id=" + encodeURIComponent(shapeId) + "&encoded=1");
        if (!r.ok) return null;
        const encoded = await r.text();
        const coords = decodePolyline(encoded);
        shapeCache.set(shapeId, coords);
        return coords;
      } catch { return null; }
    }

    function closeStopCard() {
      document.getElementById("stop-card").style.display = "none";
    }
    document.getElementById("stop-card-close").onclick = closeStopCard;

    function closeVehicleCard() {
      selectedVehicleId = null;
      document.getElementById("bus-card").style.display = "none";
      map.getSource("route-line")?.setData({ type: "FeatureCollection", features: [] });
      drawOverlay();
    }
    document.getElementById("bus-card-close").onclick = closeVehicleCard;

    // Vehicle click & route display
    async function selectVehicle(id) {
      selectedVehicleId = id;
      const v = vehicles.get(id);
      if (!v) return;

      closeStopCard();
      document.getElementById("bus-card").style.display = "flex";
      const lineShort = v.route_short_name || v.rid;
      document.getElementById("bus-card-badge").textContent = lineShort;
      document.getElementById("bus-card-badge").style.backgroundColor = getRouteColor(v.rid);
      document.getElementById("bus-card-vid").textContent = "Mezzo #" + (v.vid ?? v.id);

      const speed = v.spd != null ? Math.round(Number(v.spd)) : (v.speed != null ? Math.round(Number(v.speed)) : null);
      document.getElementById("bus-card-speed").textContent = speed != null && speed > 0 ? (speed + " km/h") : "Fermo / In sosta";

      const delay = v.delay != null ? Number(v.delay) : null;
      const delayEl = document.getElementById("bus-card-delay");
      if (delay == null) {
        delayEl.textContent = "Orario previsto";
        delayEl.className = "delay-pill delay-unknown";
      } else if (delay <= 120 && delay >= -60) {
        delayEl.textContent = "In orario";
        delayEl.className = "delay-pill delay-on-time";
      } else if (delay > 120) {
        delayEl.textContent = `+${Math.round(delay / 60)} min ritardo`;
        delayEl.className = "delay-pill delay-late";
      } else {
        delayEl.textContent = `${Math.round(Math.abs(delay) / 60)} min anticipo`;
        delayEl.className = "delay-pill delay-early";
      }

      // Initial destination placeholder based on route data
      const rMeta = routesData[v.rid] || routesData[lineShort];
      const defaultDest = rMeta?.route_long_name || ("Linea " + lineShort);
      document.getElementById("bus-card-dest").textContent = defaultDest;

      // Draw route on MapLibre GPU layer (preserving current camera zoom without zooming out)
      const shapeId = v.shapeId;
      if (shapeId) {
        const coords = await loadShape(shapeId);
        if (coords && coords.length > 1) {
          map.getSource("route-line")?.setData({
            type: "Feature",
            properties: { color: getRouteColor(v.rid) },
            geometry: { type: "LineString", coordinates: coords }
          });
        }
      }

      // Timeline placeholder
      document.getElementById("bus-card-timeline").innerHTML = '<div style="color: var(--muted); font-size: 13px;">Caricamento fermate…</div>';

      // Fetch timetable & destination
      let gotTimetable = false;
      if (v.tid) {
        try {
          const r = await fetch("/api/trip-detail?tripId=" + encodeURIComponent(v.tid));
          if (r.ok) {
            const detail = await r.json();
            if (detail?.destination) {
              document.getElementById("bus-card-dest").textContent = detail.destination;
            }
            if (Array.isArray(detail?.timetable) && detail.timetable.length > 0) {
              renderTimeline(detail.timetable, v.currentStopSequence);
              gotTimetable = true;
            }
          }
        } catch {}
      }

      // Fallback: use shapeStopsData if timetable wasn't available
      if (!gotTimetable && shapeId && shapeStopsData[shapeId]) {
        const stopIds = shapeStopsData[shapeId];
        const fallbackStops = stopIds.map((sid, idx) => ({
          stop_id: sid,
          stop_name: stopsMap.get(sid) || ("Fermata #" + sid),
          sequence: idx + 1
        }));
        if (fallbackStops.length > 0) {
          document.getElementById("bus-card-dest").textContent = fallbackStops[fallbackStops.length - 1].stop_name;
          renderTimeline(fallbackStops, v.currentStopSequence);
          gotTimetable = true;
        }
      }

      if (!gotTimetable) {
        renderTimeline([], null);
      }

      drawOverlay();
    }

    function renderTimeline(stops, currentSeq) {
      const container = document.getElementById("bus-card-timeline");
      container.innerHTML = "";
      if (!stops || !stops.length) {
        container.innerHTML = '<div style="color: var(--muted); font-size: 13px;">Nessuna fermata disponibile</div>';
        return;
      }

      let upcoming = stops;
      const seqNum = Number(currentSeq);
      if (Number.isFinite(seqNum) && seqNum > 0) {
        const filtered = stops.filter(st => st.sequence == null || st.sequence >= seqNum);
        if (filtered.length > 0) upcoming = filtered;
      }

      upcoming.slice(0, 15).forEach((st, idx) => {
        const item = document.createElement("div");
        item.className = "timeline-item";
        const isNext = idx === 0;
        const sName = st.stop_name || st.name || stopsMap.get(String(st.stop_id)) || ("Fermata #" + st.stop_id);
        const arrTime = st.arrival ? st.arrival.slice(0, 5) : "";
        item.innerHTML = `
          <div class="timeline-stop-name">
            <span class="timeline-dot ${isNext ? 'next' : ''}"></span>
            <span style="${isNext ? 'font-weight: 700;' : ''}">${sName}</span>
          </div>
          <span style="font-weight: 600; font-size: 12px; color: ${isNext ? 'var(--ink)' : 'var(--muted)'};">${arrTime}</span>
        `;
        container.appendChild(item);
      });
    }

    function minutesUntil(arrivalStr) {
      if (!arrivalStr) return null;
      const parts = arrivalStr.split(':').map(Number);
      if (parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) return null;
      const now = new Date();
      const romeTimeStr = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Europe/Rome',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(now);
      const [currH, currM] = romeTimeStr.split(':').map(Number);
      let diff = (parts[0] * 60 + parts[1]) - (currH * 60 + currM);
      if (diff < -720) diff += 1440;
      return diff;
    }

    // Show Stop Card
    async function showStopCard(stopId, stopName) {
      closeVehicleCard();
      document.getElementById("stop-card").style.display = "flex";
      document.getElementById("stop-card-name").textContent = stopName || stopsMap.get(String(stopId)) || ("Fermata #" + stopId);
      document.getElementById("stop-card-id").textContent = "Fermata #" + stopId;

      const container = document.getElementById("stop-card-arrivals");
      container.innerHTML = '<div style="color: var(--muted); font-size: 13px;">Caricamento arrivi…</div>';

      try {
        const r = await fetch("/api/stop-timetable?stopId=" + encodeURIComponent(stopId));
        const arrivals = await r.json();
        container.innerHTML = "";
        if (!arrivals.length) {
          container.innerHTML = '<div style="color: var(--muted); font-size: 13px;">Nessun arrivo nelle prossime ore</div>';
          return;
        }
        arrivals.slice(0, 10).forEach(arr => {
          const item = document.createElement("div");
          item.className = "timeline-item";
          const headsign = arr.headsign || arr.trip_headsign || "Capolinea";
          const rObj = routesData[arr.route_id];
          const line = rObj?.route_short_name || arr.route_short_name || arr.route_id;
          const time = arr.arrival ? arr.arrival.slice(0, 5) : (arr.arrival_time ? arr.arrival_time.slice(0, 5) : "");
          const mins = minutesUntil(arr.arrival || arr.arrival_time);
          const isLive = arr.monitored === true;

          let countdownText = time;
          if (mins != null && mins <= 0) {
            countdownText = "In arrivo";
          } else if (mins != null && mins <= 60) {
            countdownText = `${mins} min`;
          }

          let delayBadge = "";
          if (arr.delay != null) {
            const delayMin = Math.round(arr.delay / 60);
            if (arr.delay > 120) {
              delayBadge = `<span class="delay-pill delay-late" style="font-size: 10px; padding: 1px 5px;">+${delayMin}'</span>`;
            } else if (arr.delay < -60) {
              delayBadge = `<span class="delay-pill delay-early" style="font-size: 10px; padding: 1px 5px;">${delayMin}'</span>`;
            } else {
              delayBadge = `<span class="delay-pill delay-on-time" style="font-size: 10px; padding: 1px 5px;">In orario</span>`;
            }
          }

          item.innerHTML = `
            <div style="display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1;">
              <span class="route-pill" style="background: ${getRouteColor(arr.route_id)}; font-size: 11px; padding: 2px 7px; flex-shrink: 0;">${line}</span>
              <div style="min-width: 0; display: flex; flex-direction: column;">
                <span style="font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${headsign}</span>
                <span style="font-size: 11px; color: var(--muted);">${isLive ? '● Live GPS' : 'Orario programmato'}</span>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0; margin-left: 8px; gap: 2px;">
              <span style="font-weight: 700; font-size: 13px; color: ${isLive ? '#166534' : 'var(--ink)'};">${countdownText}</span>
              <div style="display: flex; align-items: center; gap: 4px;">
                <span style="font-size: 11px; color: var(--muted);">${time}</span>
                ${delayBadge}
              </div>
            </div>
          `;
          container.appendChild(item);
        });
      } catch {
        container.innerHTML = '<div style="color: var(--muted); font-size: 13px;">Dati non disponibili</div>';
      }
    }

    // Canvas click interaction: select bus or deselect if clicking empty space
    map.getCanvasContainer().addEventListener("click", (e) => {
      const rect = map.getContainer().getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      let hitId = null;
      let minD = Infinity;
      for (let i = hits.length - 1; i >= 0; i--) {
        const h = hits[i];
        const d = Math.hypot(h.x - x, h.y - y);
        if (d <= h.r && d < minD) {
          minD = d;
          hitId = h.id;
        }
      }
      if (hitId) {
        selectVehicle(hitId);
      } else {
        // Check if user clicked on a rendered stop circle
        const bbox = [[x - 6, y - 6], [x + 6, y + 6]];
        const stopFeatures = map.queryRenderedFeatures(bbox, { layers: ["stops-circle"] });
        if (!stopFeatures || !stopFeatures.length) {
          // Empty space clicked: deselect both vehicle and stop cards!
          closeVehicleCard();
          closeStopCard();
        }
      }
    });

    // Prevent clicks inside UI cards and controls from propagating to map canvas
    document.getElementById("bus-card").addEventListener("click", e => e.stopPropagation());
    document.getElementById("stop-card").addEventListener("click", e => e.stopPropagation());
    document.querySelector(".search-box").addEventListener("click", e => e.stopPropagation());
    document.querySelector(".map-controls").addEventListener("click", e => e.stopPropagation());

    // ESC key closes cards
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeVehicleCard();
        closeStopCard();
        document.getElementById("search-results").style.display = "none";
      }
    });

    // Realtime Polling
    async function refreshVehicles() {
      try {
        const [vehList, delays] = await Promise.all([
          fetch("/api/vehicles").then(r => r.json()),
          fetch("/api/trip-updates").then(r => r.json()).catch(() => ({}))
        ]);

        const now = performance.now();
        const nextVehicles = new Map();

        vehList.forEach(v => {
          const id = String(v.vid ?? v.id);
          const lat = Number(v.lat), lon = Number(v.lon);
          if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

          const prev = vehicles.get(id);
          const from = prev ? currentVehiclePosition(prev, now) : { lon, lat };

          nextVehicles.set(id, {
            ...v,
            lon,
            lat,
            delay: v.tid && delays[v.tid] != null ? delays[v.tid] : null,
            _fromLon: from.lon,
            _fromLat: from.lat,
            _startedAt: now
          });
        });

        vehicles = nextVehicles;
        document.getElementById("live-count").textContent = `${vehicles.size} mezzi`;
        drawOverlay();
      } catch (err) {
        console.warn("Poll error:", err);
      }
    }

    function startPolling() {
      refreshVehicles();
      setInterval(refreshVehicles, 10000);

      // Load static stops
      fetch("/api/stops")
        .then(r => r.json())
        .then(stops => {
          stopsData = stops || [];
          stopsMap = new Map();
          const features = [];
          stopsData.forEach(s => {
            const sid = String(s.id ?? s.stop_id ?? "");
            const sname = s.name ?? s.stop_name ?? ("Fermata #" + sid);
            const lon = Number(s.lon ?? s.stop_lon);
            const lat = Number(s.lat ?? s.stop_lat);
            stopsMap.set(sid, sname);
            if (Number.isFinite(lon) && Number.isFinite(lat)) {
              features.push({
                type: "Feature",
                properties: { id: sid, name: sname },
                geometry: { type: "Point", coordinates: [lon, lat] }
              });
            }
          });
          map.getSource("stops")?.setData({
            type: "FeatureCollection",
            features
          });
        })
        .catch(() => {});

      // Load static routes
      fetch("/api/routes")
        .then(r => r.json())
        .then(routes => { routesData = routes || {}; })
        .catch(() => {});

      // Load shape stops sequence mapping
      fetch("/api/shape-stops")
        .then(r => r.json())
        .then(ss => { shapeStopsData = ss || {}; })
        .catch(() => {});
    }

    // Controls
    document.getElementById("ctrl-zoom-in").onclick = () => map.zoomIn({ duration: 300 });
    document.getElementById("ctrl-zoom-out").onclick = () => map.zoomOut({ duration: 300 });
    document.getElementById("ctrl-center").onclick = () => map.flyTo({ center: BARI_CENTER, zoom: 12.8, duration: 600 });
    document.getElementById("ctrl-north").onclick = () => map.resetNorth({ duration: 400 });

    document.getElementById("toggle-stops").onclick = () => {
      stopsVisible = !stopsVisible;
      document.getElementById("toggle-stops").setAttribute("aria-pressed", String(stopsVisible));
      const vis = stopsVisible ? "visible" : "none";
      map.setLayoutProperty("stops-circle", "visibility", vis);
      map.setLayoutProperty("stops-label", "visibility", vis);
    };

    // Dark Theme Toggle
    document.getElementById("theme-toggle").onclick = () => {
      isDark = !isDark;
      document.documentElement.dataset.theme = isDark ? "dark" : "light";
      document.getElementById("theme-toggle").textContent = isDark ? "Tema chiaro" : "Tema scuro";
      localStorage.setItem("bari-bus-map-theme", isDark ? "dark" : "light");
      map.setStyle(isDark ? STYLES.dark : STYLES.light);
      map.once("styledata", () => {
        initMapSources();
        drawOverlay();
        if (stopsVisible) {
          map.setLayoutProperty("stops-circle", "visibility", "visible");
          map.setLayoutProperty("stops-label", "visibility", "visible");
        }
      });
    };

    // Search functionality
    const searchInput = document.getElementById("search-input");
    const searchResults = document.getElementById("search-results");

    searchInput.addEventListener("input", () => {
      const q = searchInput.value.trim().toLowerCase();
      if (!q) { searchResults.style.display = "none"; return; }

      const matches = [];
      // Match lines
      for (const [rid, r] of Object.entries(routesData)) {
        const shortName = String(r.route_short_name || rid || "");
        const longName = String(r.route_long_name || "");
        if (shortName.toLowerCase().includes(q) || longName.toLowerCase().includes(q) || rid.toLowerCase().includes(q)) {
          matches.push({
            type: "route",
            id: rid,
            title: "Linea " + shortName,
            sub: longName || ("Percorso linea " + shortName)
          });
        }
      }
      // Match stops
      for (const s of stopsData) {
        const sName = String(s.name ?? s.stop_name ?? "");
        const sId = String(s.id ?? s.stop_id ?? "");
        if (sName.toLowerCase().includes(q) || sId.includes(q)) {
          matches.push({
            type: "stop",
            id: sId,
            title: sName,
            sub: "Fermata #" + sId,
            lat: s.lat ?? s.stop_lat,
            lon: s.lon ?? s.stop_lon
          });
        }
        if (matches.length > 25) break;
      }

      if (!matches.length) {
        searchResults.innerHTML = '<div style="padding: 10px; color: var(--muted); font-size: 13px;">Nessun risultato</div>';
        searchResults.style.display = "block";
        return;
      }

      searchResults.innerHTML = "";
      matches.slice(0, 10).forEach(m => {
        const el = document.createElement("div");
        el.className = "search-item";
        el.innerHTML = `
          <div>
            <div style="font-weight: 600;">${m.title}</div>
            <div style="font-size: 12px; color: var(--muted);">${m.sub || ''}</div>
          </div>
        `;
        el.onclick = async () => {
          searchResults.style.display = "none";
          searchInput.value = "";
          if (m.type === "stop") {
            map.flyTo({ center: [Number(m.lon), Number(m.lat)], zoom: 16, duration: 600 });
            showStopCard(m.id, m.title);
          } else {
            // Find live vehicle of this route or show route
            const v = Array.from(vehicles.values()).find(veh => String(veh.rid) === String(m.id) || String(veh.route_short_name) === String(m.id));
            if (v) {
              selectVehicle(String(v.vid ?? v.id));
            } else {
              try {
                const rshapes = await fetch("/api/route-shapes").then(res => res.json());
                const shapes = rshapes[m.id];
                if (shapes && shapes.length > 0) {
                  const coords = await loadShape(shapes[0]);
                  if (coords && coords.length > 1) {
                    map.getSource("route-line")?.setData({
                      type: "Feature",
                      properties: { color: getRouteColor(m.id) },
                      geometry: { type: "LineString", coordinates: coords }
                    });
                  }
                }
              } catch {}
            }
          }
        };
        searchResults.appendChild(el);
      });
      searchResults.style.display = "block";
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-box")) searchResults.style.display = "none";
    });
  </script>
</body>
</html>
